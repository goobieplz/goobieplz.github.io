<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shared recipe</title>
<meta property="og:title" content="A recipe shared from Recipe Goblin">
<meta property="og:description" content="Open this link in Recipe Goblin to save the recipe, or read it here.">
<style>
  /* Goblin Kitchen (art/goblin-kitchen/ui-theme.png): parchment by day, the night sky after dark. */
  :root { --bg: #f3e7cb; --fg: #3a2216; --muted: #6a4a32; --accent: #a0490e; --card: #f7e8c8; --line: #1a0d18; --edge: #d9c49a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0a1430; --fg: #f7e8c8; --muted: #b8c4dc; --accent: #f6be62; --card: #14294a; --line: #1a0d18; --edge: #0a1430; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.7rem; line-height: 1.2; margin: 0 0 6px; }
  h2 { font-size: 1.15rem; margin: 28px 0 8px; }
  h3 { font-size: 1rem; color: var(--accent); margin: 16px 0 4px; }
  .meta { color: var(--muted); margin: 0 0 4px; }
  a { color: var(--accent); }
  ul, ol { padding-left: 1.3em; }
  li { margin: 4px 0; }
  .card { background: var(--card); border: 2px solid var(--line); border-bottom-width: 2px; box-shadow: inset 0 -4px 0 var(--edge); border-radius: 4px; padding: 14px 16px 18px; margin: 16px 0; }
  button { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 3px; border: 2px solid #1a0d18; background: #e8862f; color: #2a1208; box-shadow: inset 0 -4px 0 #b3561c; cursor: pointer; }
  .error { color: #b3261e; }
  .photo { margin: -24px -16px 20px; aspect-ratio: 16 / 10; overflow: hidden; background: var(--card); border-radius: 0 0 6px 6px; }
  .photo img { display: block; width: 100%; height: 100%; object-fit: cover; transition: filter .5s ease, transform .5s ease; }
  .photo img.soft { filter: blur(5px); transform: scale(1.06); }
  @media (min-width: 712px) { .photo { margin: 0 0 20px; border: 2px solid var(--line); border-radius: 6px; } }
  .card.app { display: flex; gap: 14px; align-items: center; }
  .goblin { width: 64px; height: 64px; flex: none; image-rendering: pixelated; border: 2px solid #1a0d18; border-radius: 4px; }
  .card.app p { margin: 0 0 8px; }
</style>
</head>
<body>
<main>
  <div id="app"><p>Opening the recipe…</p></div>
</main>
<script>

  const app = document.getElementById("app");

  function el(tag, text, attrs) {
    const node = document.createElement(tag);
    if (text != null) node.textContent = text;
    for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
    return node;
  }

  function safeHttpsUrl(value) {
    const url = safeHttpUrl(value);
    return url && url.startsWith("https:") ? url : null;
  }

  // The link's photo: its small thumbnail at once (soft), then the full photo once it has loaded.
  // The sender's own photo ("own") has no full version to fetch.
  function photo(r) {
    const thumb = typeof r.th === "string" && /^[A-Za-z0-9_-]{1,16384}$/.test(r.th) ? r.th.replace(/-/g, "+").replace(/_/g, "/") : null;
    const thumbSrc = thumb ? "data:image/webp;base64," + thumb + "===".slice((thumb.length + 3) % 4) : null;
    const full = r.own && thumbSrc ? null : safeHttpsUrl(r.img);
    if (!thumbSrc && !full) return null;
    const box = el("div", null, { class: "photo" });
    const img = el("img", null, { alt: "", decoding: "async", referrerpolicy: "no-referrer" });
    if (thumbSrc) { img.src = thumbSrc; img.className = "soft"; } else { img.src = full; }
    if (full && thumbSrc) {
      const sharp = new Image();
      sharp.referrerPolicy = "no-referrer";
      sharp.onload = () => { img.src = full; img.className = ""; };
      sharp.src = full;
    }
    img.onerror = () => box.remove();
    box.append(img);
    return box;
  }

  function safeHttpUrl(value) {
    try {
      const url = new URL(value);
      return url.protocol === "https:" || url.protocol === "http:" ? url.href : null;
    } catch { return null; }
  }

  function minutes(m) {
    const h = Math.floor(m / 60), r = m % 60;
    return [h ? h + " hr" : "", r ? r + " min" : ""].filter(Boolean).join(" ");
  }

  async function decode(hash) {
    const match = /^#(\d+)\.([A-Za-z0-9_-]+)$/.exec(hash);
    if (!match) throw new Error("This isn't a complete recipe link.");
    if (match[1] !== "1") throw new Error("This link was made by a newer version of the app.");
    const b64 = match[2].replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(b64 + "===".slice((b64.length + 3) % 4));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    const reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate")).getReader();
    const chunks = [];
    let total = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      total += value.length;
      if (total > MAX_BYTES) throw new Error("This recipe link is too large to open.");
      chunks.push(value);
    }
    const all = new Uint8Array(total);
    let offset = 0;
    for (const c of chunks) { all.set(c, offset); offset += c.length; }
    const recipe = JSON.parse(new TextDecoder().decode(all));
    if (typeof recipe.t !== "string" || !Array.isArray(recipe.i)) throw new Error("This recipe link isn't valid.");
    return recipe;
  }

  function sections(list, ordered) {
    const frag = document.createDocumentFragment();
    let n = 0;
    for (const s of list || []) {
      if (s.n) frag.append(el("h3", s.n));
      const listEl = el(ordered ? "ol" : "ul");
      if (ordered) listEl.setAttribute("start", String(n + 1));
      for (const item of s.x || []) { listEl.append(el("li", String(item))); n++; }
      frag.append(listEl);
    }
    return frag;
  }

  function render(r) {
    document.title = r.t;
    app.replaceChildren();
    const pic = photo(r);
    if (pic) app.append(pic);
    app.append(el("h1", r.t));
    // A recipe the sender wrote has a made-up source on a host that can't exist (core: OwnRecipes): no page to link to.
    const own = !!r.u && /^https:\/\/own\.recipegoblin\.invalid\//.test(r.u);
    const source = own ? null : safeHttpUrl(r.u);
    const site = source ? new URL(source).hostname.replace(/^www\./, "") : "";
    const meta = el("p", null, { class: "meta" });
    if (source) meta.append(el("a", site, { href: source, rel: "noopener noreferrer" }));
    if (own) meta.append(document.createTextNode("A home-made recipe"));
    if (r.a) meta.append(document.createTextNode((source || own ? " · " : "") + "by " + r.a));
    app.append(meta);
    const extra = [r.y ? "Makes " + r.y : "", r.pm ? "Prep " + minutes(r.pm) : "", r.cm ? "Cook " + minutes(r.cm) : "", r.tm ? "Total " + minutes(r.tm) : ""].filter(Boolean);
    if (extra.length) app.append(el("p", extra.join(" · "), { class: "meta" }));

    const card = el("div", null, { class: "card app" });
    card.insertAdjacentHTML("afterbegin", GOBLIN); // the app's own artwork, never anything from the link
    const side = el("div");
    side.append(el("p", "Have Recipe Goblin? Copy this page's link, then tap Paste link in the app to save the recipe."));
    const copy = el("button", "Copy link");
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(location.href); copy.textContent = "Copied"; } catch { copy.textContent = "Copy the address bar instead"; }
    });
    side.append(copy);
    card.append(side);
    app.append(card);

    app.append(el("h2", "Ingredients"), sections(r.i, false));
    app.append(el("h2", "Steps"));
    if (r.st && r.st.length) app.append(sections(r.st, true));
    else app.append(el("p", own ? "No steps written down yet." : "The steps weren't in the original page's recipe data. See the original page.", { class: "meta" }));
    if (source) {
      const p = el("p", "Original recipe: ");
      p.append(el("a", source, { href: source, rel: "noopener noreferrer" }));
      app.append(p);
    }
  }

  (async () => {
    if (!("DecompressionStream" in window)) {
      app.replaceChildren(el("p", "This browser is too old to open recipe links. Open the link in Recipe Goblin instead.", { class: "error" }));
      return;
    }
    try {
      render(await decode(location.hash));
    } catch (e) {
      app.replaceChildren(el("h1", "Couldn't open this recipe link"), el("p", e && e.message ? e.message : "The link is damaged.", { class: "error" }));
    }
  })();
</script>
</body>
</html>
